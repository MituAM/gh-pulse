# gh-pulse dashboard. Listens on loopback only: the sole way in from outside is cloudflared.
#
# Everything is static. The two JSON files under /api/ are rewritten atomically by the poller and
# the Flink job; their short s-maxage is what lets Cloudflare absorb a traffic spike — however many
# visitors there are, the origin sees roughly one request per file every few seconds.

map $uri $ghpulse_cache_control {
    ~^/api/         "public, max-age=5, s-maxage=5, stale-while-revalidate=30, stale-if-error=600";
    ~\.(css|js)$    "public, max-age=300, s-maxage=3600";
    default         "public, max-age=60, s-maxage=300";
}

server {
    listen 127.0.0.1:8080;
    server_name _;
    server_tokens off;

    root /opt/gh-pulse/web;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_min_length 256;
    gzip_types application/json text/css application/javascript;

    add_header Cache-Control $ghpulse_cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    # Temp files are written as dotfiles before being renamed into place; never serve them.
    location ~ /\. { deny all; }

    location /api/ {
        alias /var/lib/gh-pulse/public/;
        default_type application/json;
        types { application/json json; }
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
