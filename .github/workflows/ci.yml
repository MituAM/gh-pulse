name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The two JDKs both Spark 3.5 and Flink 1.18 support. Java 8 is excluded on purpose: the
        # test JVMs need --add-opens, which a Java 8 launcher rejects outright.
        java: ['11', '17']

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: sbt

      - uses: sbt/setup-sbt@v1

      - name: Check formatting
        run: sbt scalafmtCheckAll scalafmtSbtCheck

      - name: Test
        run: sbt test

      - name: Build the deployable jars
        run: sbt spark/assembly flink/assembly

      - name: Run the batch demo on the committed sample
        run: sbt demoSpark
