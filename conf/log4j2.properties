# Logging for local runs (`sbt demoSpark`), selected by -Dlog4j.configurationFile in build.sbt.
# Spark logs its entire scheduling life story at INFO, which buries the results the demo prints.
# Cluster deployments are unaffected: they use the cluster's own configuration.
rootLogger.level = warn
rootLogger.appenderRef.stderr.ref = stderr

appender.stderr.type = Console
appender.stderr.name = stderr
appender.stderr.target = SYSTEM_ERR
appender.stderr.layout.type = PatternLayout
appender.stderr.layout.pattern = %d{HH:mm:ss} %p %c{1}: %m%n

logger.spark.name = org.apache.spark
logger.spark.level = warn

# The winutils.exe warning on Windows and the missing-native-library warning on every platform are
# expected for a local run and say nothing useful.
logger.hadoop.name = org.apache.hadoop
logger.hadoop.level = error
