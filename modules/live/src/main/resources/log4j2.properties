# Logging for gh-pulse-live.jar. Goes to stdout, which systemd hands to journald:
#   journalctl -u gh-pulse-flink -f
# Flink's embedded cluster narrates its whole startup at INFO; only problems are interesting here.
rootLogger.level = warn
rootLogger.appenderRef.stdout.ref = stdout

appender.stdout.type = Console
appender.stdout.name = stdout
appender.stdout.layout.type = PatternLayout
appender.stdout.layout.pattern = %p %c{1}: %m%n

logger.ghpulse.name = ghpulse
logger.ghpulse.level = info
