# Picked up automatically by log4j2 on the test classpath.
# Flink narrates every job submission at INFO; a test report should show test results.
rootLogger.level = warn
rootLogger.appenderRef.stderr.ref = stderr

appender.stderr.type = Console
appender.stderr.name = stderr
appender.stderr.target = SYSTEM_ERR
appender.stderr.layout.type = PatternLayout
appender.stderr.layout.pattern = %d{HH:mm:ss} %p %c{1}: %m%n

logger.flink.name = org.apache.flink
logger.flink.level = warn

# Three warnings that a mini cluster always produces and that never mean anything here: there is
# no Kerberos to get tokens from, no log file for a web dashboard nobody starts, and the collect
# sink notices the job finished before it did.
logger.tokens.name = org.apache.flink.runtime.security.token.DefaultDelegationTokenManager
logger.tokens.level = error

logger.webmonitor.name = org.apache.flink.runtime.webmonitor.WebMonitorUtils
logger.webmonitor.level = error

logger.collect.name = org.apache.flink.streaming.api.operators.collect.CollectResultFetcher
logger.collect.level = error

# The collect sink's coordinator reports the mini cluster shutting down underneath it as an
# exception. Only `executeAndCollect` ever sees this, and only after the results are in.
logger.collectcoordinator.name = org.apache.flink.streaming.api.operators.collect.CollectSinkOperatorCoordinator
logger.collectcoordinator.level = error
